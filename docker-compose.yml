# Development convenience: spins up PostgreSQL (and pgAdmin) for the backend.
# The Nuxt frontend and NestJS backend are run on the host (npm run dev) so you
# get fast HMR; only the database is containerized here.
#
#   docker compose up -d        # start postgres + pgadmin
#   docker compose down         # stop (data persists in the named volume)
#   docker compose down -v      # stop and wipe data
services:
  postgres:
    image: postgres:17
    container_name: klontong-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
      POSTGRES_DB: ${DB_NAME:-klontong_admin}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - klontong_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: klontong-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - '5050:80'
    depends_on:
      - postgres

volumes:
  klontong_pgdata:
